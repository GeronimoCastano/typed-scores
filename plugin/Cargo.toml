[package]
name = "typed-scores-plugin"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
wasm-minimal-protocol = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
miniz_oxide = { version = "0.8", default-features = false, features = ["with-alloc"] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
